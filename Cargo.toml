[package]
name = "wolf2-tray"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pushes your own aircraft's telemetry from DCS to wolf2.net while a recording is live."
repository = "https://github.com/jimvella/wolf2-tray"
publish = false

# THE RULE FOR THIS FILE: keep the tree small. Members are asked to trust this
# binary; a dependency review is readable at a few dozen crates and not at a
# few hundred. No webview, no S3 SDK, no crypto beyond TLS and SHA-256.
[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
flate2 = "1"
form_urlencoded = "1"
hex = "0.4"
muda = "0.21"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tao = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tray-icon = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
winreg = "0.56"

[profile.release]
strip = true
lto = true
codegen-units = 1
